name: Tests

on:
  push:
  pull_request:

jobs:
  data-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install pandas openpyxl pytest

      - name: Validate dataset loader
        run: pytest
